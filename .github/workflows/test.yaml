---
name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Shell Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify shell script syntax
        shell: bash
        run: |
          EXIT_CODE=0
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            if ! bash -n "$script"; then
              echo "::error file=$script::Syntax error in $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -type f -print0)
          exit $EXIT_CODE

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run all non-live unit tests
        run: ./test/run-unit-tests.sh

  dry-run:
    name: Dry Run Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test help command
        run: |
          chmod +x aap-demo.sh
          ./aap-demo.sh help

      - name: Test version/info commands
        run: |
          ./aap-demo.sh version || true
          ./aap-demo.sh status --dry-run || true

  validate-scripts:
    name: Validate Script Permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check executable bits
        run: |
          EXIT_CODE=0
          # Find shell scripts with shebangs
          while read -r script; do
            if head -n 1 "$script" | grep -q '^#!'; then
              if [ ! -x "$script" ]; then
                echo "::error file=$script::Script has shebang but is not executable"
                EXIT_CODE=1
              fi
            fi
          done < <(find . -name "*.sh" -type f)
          exit $EXIT_CODE
